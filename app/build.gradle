plugins { id 'com.android.application' }
android {
    namespace 'com.zero.operator'
    compileSdk 35
    defaultConfig { applicationId "com.zero.operator"; minSdk 23; targetSdk 35; versionCode 1; versionName "1.0" }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug }; debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20240303'
}